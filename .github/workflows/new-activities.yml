name: Look for new activities

# Once a day, check the GitHub accounts in site-config.json ("watch") for new
# GitHub Pages projects. If there are any, draft entries + thumbnails and open
# (or update) a pull request. Merging it publishes them.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: new-activities

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Look for new Pages projects
        id: look
        run: node tools/find-new.mjs --list
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install the screenshot tools
        if: steps.look.outputs.count != '0'
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1 sharp@0.33.5
          npx playwright install --with-deps chromium

      - name: Draft entries and thumbnails
        if: steps.look.outputs.count != '0'
        run: node tools/find-new.mjs --write --body "$RUNNER_TEMP/pr-body.md"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Check activities.json
        if: steps.look.outputs.count != '0'
        run: node tools/check.mjs

      - name: Open or update the pull request
        if: steps.look.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NAMES: ${{ steps.look.outputs.names }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B auto/new-activities
          git add activities.json assets/thumbs
          git commit -m "Add new activities: $NAMES"
          git push --force origin auto/new-activities
          TITLE="New activities: $NAMES"
          if [ -n "$(gh pr list --head auto/new-activities --state open --json number --jq '.[].number')" ]; then
            gh pr edit auto/new-activities --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          elif gh pr create --base main --head auto/new-activities --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "Pull request opened."
          else
            # GitHub only lets workflows open pull requests if "Allow GitHub Actions to create
            # and approve pull requests" is ticked (Settings > Actions > General). Otherwise,
            # open an issue with a one-click link to create the pull request instead.
            LINK="https://github.com/$GITHUB_REPOSITORY/compare/main...auto/new-activities?expand=1"
            { echo "**[Click here, then Create pull request, then Merge]($LINK)** to put these on the site."; echo; cat "$RUNNER_TEMP/pr-body.md"; } > "$RUNNER_TEMP/issue-body.md"
            ISSUE="$(gh issue list --state open --search 'in:title "New activities"' --json number --jq '.[0].number')"
            if [ -n "$ISSUE" ]; then
              gh issue edit "$ISSUE" --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
            else
              gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/issue-body.md"
            fi
          fi
