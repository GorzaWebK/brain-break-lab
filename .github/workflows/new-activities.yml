name: Look for new activities

# Once a day, check the GitHub accounts in site-config.json ("watch") for new
# GitHub Pages projects. Any that are found are added to activities.json (with a
# thumbnail), committed straight to this branch and published. An issue lists
# what was added, so whoever looks after the site hears about it.
# Anything that looks like it has text chat with other players is added
# switched off ("enabled": false).
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # commit the new entries
  actions: write    # start the deploy workflow
  issues: write     # tell you what was added

concurrency:
  group: new-activities

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Look for new Pages projects
        id: look
        run: node tools/find-new.mjs --list
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install the screenshot tools
        if: steps.look.outputs.count != '0'
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1 sharp@0.33.5
          npx playwright install --with-deps chromium

      - name: Add entries and thumbnails
        if: steps.look.outputs.count != '0'
        run: node tools/find-new.mjs --write --body "$RUNNER_TEMP/added.md"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Same check the deploy runs. If it fails, nothing is committed.
      - name: Check activities.json
        if: steps.look.outputs.count != '0'
        run: node tools/check.mjs

      - name: Commit, publish and report
        if: steps.look.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NAMES: ${{ steps.look.outputs.names }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activities.json assets/thumbs
          git commit -m "Add new activities: $NAMES"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          # A push made by a workflow doesn't start other workflows, so start the deploy here.
          gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            gh issue create --title "Added to the site: $NAMES" --body-file "$RUNNER_TEMP/added.md"
          fi
